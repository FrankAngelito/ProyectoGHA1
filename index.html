<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <style>
    /* 1. Configuración general y reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 2. Tarjeta contenedora del formulario */
    .form-container {
      background-color: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 450px;
    }

    .form-container h2 {
      margin-bottom: 8px;
      color: #1e293b;
      font-size: 24px;
      text-align: center;
    }

    .form-container p {
      color: #64748b;
      font-size: 14px;
      text-align: center;
      margin-bottom: 24px;
    }

    /* 3. Grupos de inputs y etiquetas */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #0f172a;
      transition: all 0.2s ease-in-out;
      outline: none;
    }

    /* Efectos al enfocar los campos */
    .form-group input:focus,
    .form-group select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* 4. Campo de términos y condiciones (Checkbox) */
    .form-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .form-checkbox input {
      width: 16px;
      height: 16px;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    .form-checkbox label {
      font-size: 13px;
      color: #475569;
      cursor: pointer;
    }

    /* 5. Botón de envío */
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
    }

    .btn-submit:hover {
      background-color: #2563eb;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Crear Cuenta</h2>
    <p>Ingresa tus datos para registrarte en la plataforma</p>

    <form action="#" method="POST">
      <!-- Nombre Completo -->
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Carlos Pérez" required>
      </div>

      <!-- Correo Electrónico -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="8">
      </div>

      <!-- Selección de Rol / Categoría -->
      <div class="form-group">
        <label for="rol">Rol principal</label>
        <select id="rol" name="rol" required>
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="desarrollador">Desarrollador</option>
          <option value="disenador">Diseñador UI/UX</option>
          <option value="qa">Tester QA</option>
        </select>
      </div>

      <!-- Checkbox Términos -->
      <div class="form-checkbox">
        <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">Acepto los términos y condiciones de servicio</label>
      </div>

      <!-- Botón de Envío -->
      <button type="submit" class="btn-submit">Registrarse</button>
    </form>
  </div>

</body>
</html>
